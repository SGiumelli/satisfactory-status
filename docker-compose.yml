services:
  satisfactory:
    image: indifferentbroccoli/satisfactory-server-docker
    restart: unless-stopped
    container_name: satisfactory
    stop_grace_period: 120s
    ports:
      - 7777:7777/udp
      - 7777:7777/tcp
      - 7778:7778/tcp
    environment:
      PUID: 1000
      PGID: 1000
      GENERATE_SETTINGS: "true"
    env_file:
      - stack.env
    volumes:
      - server-files:/satisfactory
      - server-data:/home/steam/.config/Epic/FactoryGame/Saved/SaveGames

  # N'expose au bot que la lecture des conteneurs, leurs logs et le redémarrage.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: sf-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: 1
      ALLOW_LOGS: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  sf-bot:
    build: ./bot
    image: sf-bot:local
    container_name: sf-bot
    restart: unless-stopped
    depends_on:
      - satisfactory
      - socket-proxy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN manquant}
      GUILD_ID: ${GUILD_ID:?GUILD_ID manquant}
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID:?STATUS_CHANNEL_ID manquant}
      EVENTS_CHANNEL_ID: ${EVENTS_CHANNEL_ID:-}
      BACKUP_CHANNEL_ID: ${BACKUP_CHANNEL_ID:-}
      ADMIN_ROLE_ID: ${ADMIN_ROLE_ID:-}
      CONNECT_ADDRESS: ${CONNECT_ADDRESS:-}
      SERVER_LABEL: ${SERVER_LABEL:-}
      SF_HOST: satisfactory
      SF_PORT: "7777"
      SF_TOKEN: ${SF_TOKEN:?SF_TOKEN manquant}
      DOCKER_HOST: tcp://socket-proxy:2375
      CONTAINER_NAME: satisfactory
      TZ: Europe/Paris
    volumes:
      - sf-bot-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  server-files:
    name: satisfactory-server-files
    external: true
  server-data:
    name: satisfactory-server-data
    external: true
  sf-bot-data:
